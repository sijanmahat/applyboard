<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Applyboard: a small, accessible tracker for internship applications built with HTML, CSS and vanilla JavaScript.">
<title>Applyboard: internship tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Applyboard</h1>
      <p class="sub">Keep every internship application in one place. Your data stays in this browser.</p>
    </div>
    <div class="stats" aria-label="Summary">
      <div class="stat"><b id="sTotal">0</b><span>Tracked</span></div>
      <div class="stat"><b id="sApplied">0</b><span>Applied</span></div>
      <div class="stat"><b id="sRate">0%</b><span>Reply rate</span></div>
    </div>
  </header>

  <div class="bar">
    <label class="sr" for="q">Search applications</label>
    <input id="q" type="search" placeholder="Search company, role or notes">
    <label class="sr" for="f">Filter by status</label>
    <select id="f"><option value="">All statuses</option></select>
    <button id="add" class="primary">Add application</button>
    <button id="export">Export JSON</button>
    <button id="theme" aria-label="Switch colour theme">Theme</button>
  </div>

  <main id="board" class="board"></main>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Add application</h2>
    <label for="company">Company</label>
    <input id="company" required maxlength="60">
    <label for="role">Role</label>
    <input id="role" required maxlength="80" placeholder="Frontend developer intern">
    <label for="link">Posting link (optional)</label>
    <input id="link" type="url" placeholder="https://">
    <label for="status">Status</label>
    <select id="status"></select>
    <label for="date">Date</label>
    <input id="date" type="date">
    <label for="notes">Notes</label>
    <textarea id="notes" rows="3" maxlength="300"></textarea>
    <div class="actions">
      <button type="button" id="cancel">Cancel</button>
      <button class="primary" type="submit">Save application</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="undo">Undo</button></div>

<script src="js/app.js"></script>
</body>
</html>
